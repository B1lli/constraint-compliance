name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Runnable example
        working-directory: examples/rfp-response
        run: python -X utf8 ../../scripts/gate_check.py .gate/goal.json --root .
      - name: Provenance marker check
        run: python -X utf8 scripts/check_markers.py --all
